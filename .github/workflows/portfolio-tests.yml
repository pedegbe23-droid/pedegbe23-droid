name: Portfolio Python Tests

on:
  push:
    paths:
      - "projects/**"
      - ".github/workflows/portfolio-tests.yml"
  pull_request:
    paths:
      - "projects/**"
      - ".github/workflows/portfolio-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            projects/healthcare-claims-data-science/requirements.txt
            projects/financial-operations-data-science/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r projects/healthcare-claims-data-science/requirements.txt
          python -m pip install -r projects/financial-operations-data-science/requirements.txt
      - name: Test Python CSV data quality validator
        working-directory: projects/data-quality-validator
        run: python -m unittest discover -s tests -v
      - name: Test financial operations rule checks
        working-directory: projects/financial-operations-data-quality
        run: python -m unittest discover -s tests -v
      - name: Test healthcare data science
        working-directory: projects/healthcare-claims-data-science
        run: python -m unittest discover -s tests -v
      - name: Test KYC, claims and disputes anomaly analysis
        working-directory: projects/financial-operations-data-science
        run: python -m unittest discover -s tests -v
